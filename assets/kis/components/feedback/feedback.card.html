<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css"></head>
<body style="padding:20px;background:var(--surface-card);display:flex;flex-direction:column;gap:16px">
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
  <span class="kis-badge">124</span>
  <span class="kis-badge kis-badge--blue">Ny</span>
  <span class="kis-badge kis-badge--green">Klar</span>
  <span class="kis-badge kis-badge--orange">Väntar</span>
  <span class="kis-badge kis-badge--red">Försenad</span>
</div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
  <span class="kis-tag">Ballonger</span>
  <span class="kis-tag">Kalasdukning</span>
  <span class="kis-tag">Q2 2026 <span style="cursor:pointer">×</span></span>
</div>
<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
  <span class="kis-status kis-status--ok">Lager OK</span>
  <span class="kis-status kis-status--warn">Lågt saldo</span>
  <span class="kis-status kis-status--error">Slut i lager</span>
  <span class="kis-status kis-status--info">Synkas</span>
</div>
</body></html>
