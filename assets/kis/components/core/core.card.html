<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css"></head>
<body style="padding:20px;background:var(--surface-page);background-image:var(--bg-aurora);display:flex;flex-direction:column;gap:16px">
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
  <button class="kis-btn kis-btn--primary">Skapa rapport</button>
  <button class="kis-btn kis-btn--secondary">Exportera</button>
  <button class="kis-btn kis-btn--ghost">Avbryt</button>
  <button class="kis-btn kis-btn--danger">Ta bort</button>
  <button class="kis-btn kis-btn--primary kis-btn--sm">Liten</button>
  <button class="kis-btn kis-btn--primary kis-btn--lg">Stor</button>
  <button class="kis-btn kis-btn--primary" disabled>Inaktiv</button>
</div>
<div style="display:flex;gap:16px;align-items:flex-end">
  <div class="kis-field" style="width:220px">
    <label class="kis-label">E-post</label>
    <input class="kis-input" placeholder="namn@kalaskungen.se">
  </div>
  <div class="kis-field" style="width:180px">
    <label class="kis-label">Period</label>
    <select class="kis-select"><option>Q2 2026</option></select>
  </div>
</div>
<div style="display:flex;gap:16px">
  <div class="kis-card" style="flex:1;padding:14px"><b style="font-size:14px">.kis-card</b><div style="font-size:12px;color:var(--text-2)">Vitt standardkort</div></div>
  <div class="kis-glass" style="flex:1;padding:14px"><b style="font-size:14px">.kis-glass</b><div style="font-size:12px;color:var(--text-2)">Liquid glass-panel</div></div>
</div>
</body></html>
